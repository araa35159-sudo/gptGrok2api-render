services:
  - type: web
    name: gptgrok2api-render
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GO_LISTEN_ADDR
        value: :10000
      - key: GO_QUEUE_BACKEND
        value: json
      - key: GO_IMAGE_MAX_CONCURRENCY
        value: "16"
      - key: GO_IMAGE_ACCOUNT_CONCURRENCY
        value: "16"
      - key: CHATGPT2API_AUTH_KEY
        generateValue: true
      - key: CHATGPT2API_ADMIN_KEY
        generateValue: true
      - key: GITHUB_BACKUP_REPO
        value: araa35159-sudo/gptgrok2api-data
      - key: GITHUB_BACKUP_TOKEN
        sync: false
      - key: GITHUB_BACKUP_KEY
        sync: false
